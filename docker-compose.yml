# Health Check API in Docker: Compose calls each service's /health every few seconds.
# /health also checks the service's database, so "healthy" means "running and able to work".
# -f makes curl fail on a 503 (Unhealthy). Every service uses the same check, so it is written once.
x-service-healthcheck: &service-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Read by db/init/01-create-databases.sh
      BOOK_DB_PASSWORD: ${BOOK_DB_PASSWORD:-book_password}
      MEMBER_DB_PASSWORD: ${MEMBER_DB_PASSWORD:-member_password}
      LOAN_DB_PASSWORD: ${LOAN_DB_PASSWORD:-loan_password}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # -h localhost forces a TCP check, which only succeeds after the init scripts are done.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 30

  book-service:
    build: ./services/BookService
    environment:
      ConnectionStrings__BookDb: Host=postgres;Port=5432;Database=book_db;Username=book_user;Password=${BOOK_DB_PASSWORD:-book_password};GSS Encryption Mode=Disable
      # Demo only: make the Book Service slow or fail on purpose (0 = off). See FaultInjection.cs.
      FaultInjection__DelayMs: ${BOOK_FAULT_DELAY_MS:-0}
      FaultInjection__FailureRate: ${BOOK_FAULT_FAILURE_RATE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck

  member-service:
    build: ./services/MemberService
    environment:
      ConnectionStrings__MemberDb: Host=postgres;Port=5432;Database=member_db;Username=member_user;Password=${MEMBER_DB_PASSWORD:-member_password};GSS Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck

  loan-service:
    build: ./services/LoanService
    environment:
      ConnectionStrings__LoanDb: Host=postgres;Port=5432;Database=loan_db;Username=loan_user;Password=${LOAN_DB_PASSWORD:-loan_password};GSS Encryption Mode=Disable
      # Inside the Docker network a service is reached by its name and its internal port 8080.
      Services__MemberService: http://member-service:8080
      Services__BookService: http://book-service:8080
    # Only the database is needed to start. The Loan Service deliberately does not wait for
    # the Book and Member Services: it calls them per request and returns 503 when they are down.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *service-healthcheck

  # The only service with a port on your machine: clients reach everything through the gateway.
  # The other services are only reachable inside the Docker network (see docker-compose.debug.yml).
  api-gateway:
    build: ./services/ApiGateway
    environment:
      Services__BookService: http://book-service:8080
      Services__MemberService: http://member-service:8080
      Services__LoanService: http://loan-service:8080
      Gateway__ApiKey: ${GATEWAY_API_KEY:-dev-api-key}
      # Demo endpoint GET /api/diagnostics/circuits (off in docker-compose.prod.yml).
      Gateway__EnableDiagnostics: "true"
      # Circuit breaker per service (see services/ApiGateway/Resilience.cs).
      Resilience__FailureRatio: ${CIRCUIT_FAILURE_RATIO:-0.5}
      Resilience__MinimumThroughput: ${CIRCUIT_MINIMUM_THROUGHPUT:-4}
      Resilience__SamplingDurationSeconds: ${CIRCUIT_SAMPLING_SECONDS:-10}
      Resilience__BreakDurationSeconds: ${CIRCUIT_BREAK_SECONDS:-15}
      # Hide the "request started/finished" lines of ASP.NET Core and HttpClient, so the
      # retry, timeout and circuit breaker lines are easy to follow in the logs.
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    ports:
      - "5000:8080"
    # Wait until the services are healthy, so the first requests after startup don't get a 503.
    # After startup the gateway does not need them: when one goes down later, the gateway
    # answers 503 for that service only, and the overview falls back to a partial answer.
    depends_on:
      book-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      loan-service:
        condition: service_healthy
    healthcheck: *service-healthcheck

volumes:
  postgres-data:
