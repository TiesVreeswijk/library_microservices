# Member Service pipeline. Only runs when something in services/MemberService changes,
# so a change in another service never rebuilds or redeploys this one.
name: Member Service

on:
  push:
    branches: [main]
    paths:
      - "services/MemberService/**"
      - ".github/workflows/member-service.yml"
  # Adds a "Run workflow" button in the Actions tab, used for the first deploy.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      service: member-service
      context: services/MemberService
      tag-variable: MEMBER_SERVICE_TAG
