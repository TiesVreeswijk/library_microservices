# Builds the image of ONE service, pushes it to GitHub Container Registry (GHCR)
# and deploys only that service to the EduCloud VM.
#
# Not started directly: every service has its own small workflow (book-service.yml etc.)
# that only runs when that service's folder changes, and then calls this one.
name: Build and deploy one service

on:
  workflow_call:
    inputs:
      service:
        description: Service name in docker-compose.prod.yml, e.g. book-service
        required: true
        type: string
      context:
        description: Folder with the Dockerfile, e.g. services/BookService
        required: true
        type: string
      tag-variable:
        description: Variable in the VM's .env that holds this service's version, e.g. BOOK_SERVICE_TAG
        required: true
        type: string

jobs:
  # Runs on a GitHub machine.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lowercase, the GitHub user name isn't.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/library-${{ inputs.service }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA, so every version can be traced back to a commit,
      # and with latest, which the VM uses for services that were never deployed by SHA.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  # Runs on the EduCloud VM itself (self-hosted runner). The runner only makes outgoing
  # connections to GitHub, so the VM doesn't need to be reachable from the internet.
  deploy:
    needs: build
    runs-on: [self-hosted, educloud]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ${{ inputs.service }}
        run: bash deploy/deploy-service.sh "${{ inputs.service }}" "${{ inputs.tag-variable }}" "${{ github.sha }}"
